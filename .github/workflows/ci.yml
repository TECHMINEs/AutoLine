name: AutoLine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend · syntax + API smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: for f in server.js db.js routes/*.js migrations/*.js utils/*.js; do node --check "$f"; done
      - name: Boot API and hit core endpoints
        run: |
          PORT=8080 node server.js &
          for i in $(seq 1 20); do curl -sf http://localhost:8080/parts >/dev/null && break; sleep 1; done
          for path in /parts /models /employees /dashboard/total-production /qualitytest; do
            curl -sf "http://localhost:8080$path" >/dev/null || { echo "FAILED $path"; exit 1; }
          done
